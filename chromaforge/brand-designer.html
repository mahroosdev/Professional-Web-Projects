<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Designer — ChromaForge Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Nunito:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand-designer.css">
</head>
<body>
<header>
  <div class="hdr">
    <a href="index.html" class="back-btn">← Hub</a>
    <div class="logo-area">
      <div class="logo-title">ChromaForge</div>
      <div class="logo-dot">·</div>
      <div class="logo-badge">BRAND DESIGNER</div>
    </div>
    <div class="hdr-right">Brand Identity Studio</div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Brand Deliverable</div>
        <div class="section-tabs">
          <button class="sec-tab active" data-sec="identity" onclick="selectSection(this)">👑 Full Identity System</button>
          <button class="sec-tab" data-sec="style-guide" onclick="selectSection(this)">📋 Style Guide</button>
          <button class="sec-tab" data-sec="stationery" onclick="selectSection(this)">✉️ Stationery</button>
          <button class="sec-tab" data-sec="packaging" onclick="selectSection(this)">📦 Packaging</button>
          <button class="sec-tab" data-sec="social-brand" onclick="selectSection(this)">📲 Social Presence</button>
          <button class="sec-tab" data-sec="signage" onclick="selectSection(this)">🏷 Signage & OOH</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Brand Archetype</div>
        <div class="chips">
          <button class="chip active" data-mood="any" onclick="selectMood(this)">Any</button>
          <button class="chip" data-mood="luxury" onclick="selectMood(this)">Luxury</button>
          <button class="chip" data-mood="playful" onclick="selectMood(this)">Playful</button>
          <button class="chip" data-mood="bold" onclick="selectMood(this)">Bold</button>
          <button class="chip" data-mood="trust" onclick="selectMood(this)">Trust</button>
          <button class="chip" data-mood="organic" onclick="selectMood(this)">Organic</button>
          <button class="chip" data-mood="tech" onclick="selectMood(this)">Tech</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Color Count</div>
        <div class="count-row">
          <button class="cnt-btn" onclick="selCount(this,3)">3</button>
          <button class="cnt-btn active" onclick="selCount(this,4)">4</button>
          <button class="cnt-btn" onclick="selCount(this,5)">5</button>
          <button class="cnt-btn" onclick="selCount(this,6)">6</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Harmony</div>
        <div class="scheme-row">
          <button class="sch-btn active" data-sch="free" onclick="selScheme(this)">Free</button>
          <button class="sch-btn" data-sch="comp" onclick="selScheme(this)">Complementary</button>
          <button class="sch-btn" data-sch="analogous" onclick="selScheme(this)">Analogous</button>
          <button class="sch-btn" data-sch="mono" onclick="selScheme(this)">Mono</button>
          <button class="sch-btn" data-sch="triadic" onclick="selScheme(this)">Triadic</button>
        </div>
      </div>

      <button class="gen-btn" onclick="generatePalette()">Generate Brand Colors</button>
      <button class="gen-btn sec" onclick="savePalette()">Export Brand Kit</button>
    </aside>

    <main class="content">
      <div class="box">
        <div class="box-hd">
          <div>
            <div class="box-title">Curated Brand Sets</div>
            <div class="box-sub">Identity palettes for <span id="secLabel">Full Identity System</span></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="tag" id="sugTag">identity</span>
            <button class="copy-btn" onclick="generateSuggestions()">↻</button>
          </div>
        </div>
        <div class="sug-grid" id="sugGrid"></div>
      </div>

      <div class="box">
        <div class="box-hd">
          <div>
            <div class="box-title">Brand Preview</div>
            <div class="box-sub" id="mockSub">Live brand mockup</div>
          </div>
        </div>
        <div class="mock-tabs">
          <button class="mock-tab active" onclick="switchMock(this,'identity')">Identity</button>
          <button class="mock-tab" onclick="switchMock(this,'collateral')">Collateral</button>
          <button class="mock-tab" onclick="switchMock(this,'system')">Color System</button>
        </div>
        <div class="mock-viewport"><div id="mockFrame"></div></div>
      </div>

      <div class="box">
        <div class="box-hd">
          <div><div class="box-title">Brand Palette</div><div class="box-sub">Primary · Secondary · Neutral · Accent</div></div>
          <div style="display:flex;gap:5px">
            <button class="copy-btn" onclick="copyCSS()">CSS Vars</button>
            <button class="copy-btn" onclick="copyHex()">HEX List</button>
          </div>
        </div>
        <div class="pal-bar" id="palBar"></div>
        <div class="pal-swatches" id="palSwatches"></div>
        <div class="pal-actions">
          <button class="act-btn" onclick="shufflePalette()">↻ New</button>
          <button class="act-btn" onclick="genComp()">Complement</button>
          <button class="act-btn" onclick="genAnalogous()">Analogous</button>
          <button class="act-btn" onclick="genMono()">Mono</button>
        </div>
      </div>

      <div class="box">
        <div class="box-hd"><div><div class="box-title">Shade Spectrum</div></div></div>
        <div class="cmp-row" id="cmpRow"></div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script defer src="js/brand-designer.js"></script>
</body>
</html>
