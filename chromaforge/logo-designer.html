<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Designer — ChromaForge Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/logo-designer.css">
</head>
<body>
<header>
  <div class="hdr">
    <a href="index.html" class="back-btn">← Hub</a>
    <div class="logo-area">
      <div class="logo-title">ChromaForge</div>
      <div class="logo-badge">LOGO DESIGNER</div>
    </div>
    <div class="hdr-right">Mark &amp; Symbol Studio</div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Logo Type</div>
        <div class="section-tabs">
          <button class="sec-tab active" data-sec="logomark" onclick="selectSection(this)"><span class="sec-ico">⬡</span> Logomark</button>
          <button class="sec-tab" data-sec="wordmark" onclick="selectSection(this)"><span class="sec-ico">𝑊</span> Wordmark</button>
          <button class="sec-tab" data-sec="monogram" onclick="selectSection(this)"><span class="sec-ico">ℳ</span> Monogram</button>
          <button class="sec-tab" data-sec="emblem" onclick="selectSection(this)"><span class="sec-ico">🛡</span> Emblem</button>
          <button class="sec-tab" data-sec="icon-set" onclick="selectSection(this)"><span class="sec-ico">⊞</span> Icon Set</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Industry Feel</div>
        <div class="chips">
          <button class="chip active" data-mood="any" onclick="selectMood(this)">Any</button>
          <button class="chip" data-mood="luxury" onclick="selectMood(this)">Luxury</button>
          <button class="chip" data-mood="tech" onclick="selectMood(this)">Tech</button>
          <button class="chip" data-mood="organic" onclick="selectMood(this)">Organic</button>
          <button class="chip" data-mood="bold" onclick="selectMood(this)">Bold</button>
          <button class="chip" data-mood="minimal" onclick="selectMood(this)">Minimal</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Color Count</div>
        <div class="count-row">
          <button class="cnt-btn active" onclick="selCount(this,2)">2</button>
          <button class="cnt-btn" onclick="selCount(this,3)">3</button>
          <button class="cnt-btn" onclick="selCount(this,4)">4</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Scheme</div>
        <div class="scheme-row">
          <button class="sch-btn active" data-sch="free" onclick="selScheme(this)">Free</button>
          <button class="sch-btn" data-sch="comp" onclick="selScheme(this)">Complementary</button>
          <button class="sch-btn" data-sch="mono" onclick="selScheme(this)">Monochromatic</button>
          <button class="sch-btn" data-sch="analogous" onclick="selScheme(this)">Analogous</button>
        </div>
      </div>

      <button class="gen-btn" onclick="generatePalette()">Generate Palette</button>
      <button class="gen-btn sec" onclick="savePalette()">Save Pair</button>
    </aside>

    <main class="content">
      <div class="box">
        <div class="box-hd">
          <div>
            <div class="box-title">Curated Pairings</div>
            <div class="box-sub">Color pairs for <span id="secLabel">Logomark</span></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="tag" id="sugTag">logomark</span>
            <button class="copy-btn" onclick="generateSuggestions()">↻</button>
          </div>
        </div>
        <div class="sug-grid" id="sugGrid"></div>
      </div>

      <div class="box">
        <div class="box-hd">
          <div>
            <div class="box-title">Logo Preview</div>
            <div class="box-sub" id="mockSub">Applied to logo context</div>
          </div>
        </div>
        <div class="mock-tabs">
          <button class="mock-tab active" onclick="switchMock(this,'mark')">Mark</button>
          <button class="mock-tab" onclick="switchMock(this,'card')">Business Card</button>
          <button class="mock-tab" onclick="switchMock(this,'brand')">Brand Sheet</button>
        </div>
        <div class="mock-viewport"><div id="mockFrame"></div></div>
      </div>

      <div class="box">
        <div class="box-hd">
          <div><div class="box-title">Color Palette</div><div class="box-sub">Precision color pairs</div></div>
          <div style="display:flex;gap:5px">
            <button class="copy-btn" onclick="copyCSS()">CSS</button>
            <button class="copy-btn" onclick="copyHex()">HEX</button>
          </div>
        </div>
        <div class="pal-bar" id="palBar"></div>
        <div class="pal-swatches" id="palSwatches"></div>
        <div class="pal-actions">
          <button class="act-btn" onclick="shufflePalette()">↻ New</button>
          <button class="act-btn" onclick="genComp()">Complement</button>
          <button class="act-btn" onclick="genMono()">Monochromatic</button>
        </div>
      </div>

      <div class="box">
        <div class="box-hd"><div><div class="box-title">Shade Scale</div></div></div>
        <div class="cmp-row" id="cmpRow"></div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script defer src="js/logo-designer.js"></script>
</body>
</html>
